<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Ray Cargo Inspector V8 Pro FIXED</title>
<style>
body{
background:#07111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
max-width:700px;
margin:auto;
}
.card{
background:#0d1b2a;
border:1px solid #13324f;
padding:20px;
border-radius:16px;
margin-bottom:20px;
}
input,textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #1d4d77;
background:#081521;
color:white;
font-size:16px;
margin-top:10px;
box-sizing:border-box;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#00c8f0;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}
img{
max-width:100%;
border-radius:12px;
margin-top:15px;
}
.result{
margin-top:20px;
padding:15px;
border-radius:12px;
background:#102235;
line-height:1.7;
white-space:pre-wrap;
}
.err{
background:#3a0f17;
border:1px solid #ff3355;
}
.ok{
background:#0f3321;
border:1px solid #00d084;
}
</style>
</head>
<body>

<h1>📦 X-Ray Cargo Inspector V8 Pro FIXED</h1>

<div class="card">
<h3>Gemini API Key</h3>
<input id="apiKey" placeholder="AIza..." type="password">
<button onclick="saveKey()">Lưu API Key</button>
</div>

<div class="card">
<h3>Manifest / Tờ khai</h3>
<textarea id="manifest" rows="5" placeholder="Nhập thông tin manifest"></textarea>
</div>

<div class="card">
<h3>Ảnh X-Ray</h3>
<input type="file" accept="image/*" id="fileInput">
<img id="preview" style="display:none;">
<button onclick="analyze()">Phân tích ảnh X-ray</button>
</div>

<div id="result"></div>

<script>
let imageBase64 = '';

document.getElementById('fileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){
        imageBase64 = ev.target.result.split(',')[1];

        const img = document.getElementById('preview');
        img.src = ev.target.result;
        img.style.display = 'block';
    };

    reader.readAsDataURL(file);
});

function saveKey(){
    const key = document.getElementById('apiKey').value.trim();

    localStorage.setItem('gemini_key', key);

    alert('Đã lưu API Key');
}

async function analyze(){

    const result = document.getElementById('result');

    result.innerHTML = '<div class="result">Đang phân tích...</div>';

    const key = localStorage.getItem('gemini_key');

    if(!key){
        result.innerHTML = '<div class="result err">Chưa có API key</div>';
        return;
    }

    if(!imageBase64){
        result.innerHTML = '<div class="result err">Chưa chọn ảnh</div>';
        return;
    }

    const manifest = document.getElementById('manifest').value;

    try{

        const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${key}`,
        {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                contents:[
                    {
                        parts:[
                            {
                                inline_data:{
                                    mime_type:'image/jpeg',
                                    data:imageBase64
                                }
                            },
                            {
                                text:
`Bạn là chuyên gia phân tích ảnh soi chiếu container Hải quan Việt Nam.

Manifest:
${manifest}

Hãy:
1. Nhận diện vật thể trong ảnh
2. Đánh giá phù hợp manifest
3. Nêu điểm nghi vấn
4. Kết luận thông quan hay giữ kiểm tra

Trả lời tiếng Việt rõ ràng.`
                            }
                        ]
                    }
                ],
                generationConfig:{
                    temperature:0.2,
                    maxOutputTokens:1200
                }
            })
        });

        const data = await response.json();

        console.log(data);

        if(data.error){

            result.innerHTML =
            `<div class="result err">
<b>Lỗi Gemini API</b>

${data.error.message}
</div>`;

            return;
        }

        const text =
        data.candidates?.[0]?.content?.parts?.[0]?.text
        || 'Không có kết quả';

        result.innerHTML =
        `<div class="result ok">${text}</div>`;

    }catch(err){

        result.innerHTML =
        `<div class="result err">
<b>Lỗi kết nối</b>

${err.message}
</div>`;
    }
}
</script>

</body>
</html>
