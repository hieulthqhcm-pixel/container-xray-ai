<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container X-Ray AI V11</title>
<style>
body{background:#050b13;color:#eef7ff;font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:16px}
.card{background:#0e1b2b;border:1px solid #1b4167;border-radius:18px;padding:18px;margin:16px 0}
input,textarea{width:100%;background:#071320;color:white;border:1px solid #2b5d8c;border-radius:12px;padding:14px;font-size:16px;box-sizing:border-box}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;background:#00aeea;color:white;font-weight:bold;font-size:17px}
.result{white-space:pre-wrap;line-height:1.7;background:#0d1d30;border:1px solid #1b4167;border-radius:16px;padding:16px;margin-top:14px}
.ok{background:#0b2d20;border-color:#00e096}.err{background:#34101a;border-color:#ff3b5c}
img{width:100%;border-radius:14px;border:1px solid #1b4167;margin-top:12px}
.det{padding:10px;background:#071320;border:1px solid #214c75;border-radius:12px;margin:8px 0}
</style>
</head>
<body>
<h1>📦 Container X-Ray AI V11 Backend Secure</h1>
<p>Bản V11: người dùng không cần nhập Gemini API key. Key nằm trên backend Render.</p>

<div class="card">
<h3>1. Backend URL</h3>
<input id="backendUrl" placeholder="https://ten-backend.onrender.com">
<button onclick="saveBackend()">Lưu Backend URL</button>
<button onclick="checkBackend()">Kiểm tra backend</button>
</div>

<div class="card">
<h3>2. Manifest / Tờ khai</h3>
<textarea id="manifest" rows="5" placeholder="Nhập tên hàng, HS, số lượng, trọng lượng, xuất xứ..."></textarea>
</div>

<div class="card">
<h3>3. Ảnh soi chiếu X-Ray</h3>
<input id="file" type="file" accept="image/*">
<button onclick="analyze()">Phân tích ảnh X-Ray V11</button>
</div>

<div id="out"></div>

<script>
window.addEventListener('DOMContentLoaded',()=>{
 const u=localStorage.getItem('backend_url')||'';
 if(u) backendUrl.value=u;
});
function saveBackend(){
 const u=backendUrl.value.trim().replace(/\/$/,'');
 if(!u.startsWith('http')){alert('Backend URL phải bắt đầu bằng http hoặc https');return}
 localStorage.setItem('backend_url',u); alert('Đã lưu Backend URL');
}
function getBackend(){
 const u=backendUrl.value.trim().replace(/\/$/,'')||localStorage.getItem('backend_url')||'';
 if(u)localStorage.setItem('backend_url',u);
 return u;
}
async function checkBackend(){
 const out=document.getElementById('out'); const u=getBackend();
 if(!u){out.innerHTML='<div class="result err">Chưa nhập Backend URL.</div>';return}
 out.innerHTML='<div class="result">Đang kiểm tra backend...</div>';
 try{
  const r=await fetch(u+'/health'); const d=await r.json();
  out.innerHTML='<div class="result ok">'+JSON.stringify(d,null,2)+'</div>';
 }catch(e){out.innerHTML='<div class="result err">Không kết nối được backend:\n\n'+e.message+'</div>'}
}
async function analyze(){
 const out=document.getElementById('out'), u=getBackend(), f=file.files[0], m=manifest.value;
 if(!u){out.innerHTML='<div class="result err">Chưa nhập Backend URL.</div>';return}
 if(!f){out.innerHTML='<div class="result err">Chưa chọn ảnh X-Ray.</div>';return}
 const fd=new FormData(); fd.append('image',f); fd.append('manifest',m);
 out.innerHTML='<div class="result">Đang gửi ảnh lên backend V11...</div>';
 try{
  const r=await fetch(u+'/analyze',{method:'POST',body:fd}); const d=await r.json();
  if(!d.ok){out.innerHTML='<div class="result err">'+(d.error||'Lỗi backend')+'</div>';return}
  let html=`<div class="result ok"><b>Kết luận:</b> ${d.conclusion}
<b>Risk score:</b> ${d.risk_score}/100
<b>Model AI:</b> ${d.model_used}

${d.ai_text}</div>
<div class="card"><h3>Ảnh khoanh vùng nghi vấn</h3><img src="${d.images.overlay}"></div>
<div class="card"><h3>Heatmap mật độ</h3><img src="${d.images.heat}"></div>
<div class="card"><h3>Danh sách vùng phát hiện</h3>`;
  if(!d.detections.length) html+='<div class="det">Chưa phát hiện vùng nghi vấn rõ.</div>';
  d.detections.forEach((x,i)=>{html+=`<div class="det"><b>${i+1}. ${x.label}</b><br>Vị trí: ${x.zone}<br>Diện tích: ${x.area_percent}%<br>Mật độ: ${x.density}<br>Box: ${x.box.join(', ')}</div>`});
  html+='</div>'; out.innerHTML=html;
 }catch(e){out.innerHTML='<div class="result err">Lỗi kết nối:\n\n'+e.message+'</div>'}
}
</script>
</body>
</html>
